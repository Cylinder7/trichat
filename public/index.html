<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TriChat Bridge — Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script>window.BRIDGE_SECRET = "__BRIDGE_SECRET__";</script>
</head>
<body>
  <div class="wrap">

    <header class="topbar">
      <div class="logo">⚡ <span class="logo-main">TriChat</span> <span class="logo-sub">Bridge</span></div>
      <div class="chips" id="chips">
        <div class="chip" id="chip-roblox" title="waiting…"><span class="dot"></span>Roblox</div>
        <div class="chip" id="chip-discord" title="waiting…"><span class="dot"></span>Discord</div>
        <div class="chip" id="chip-minecraft" title="waiting…"><span class="dot"></span>Minecraft</div>
        <div class="chip demo-badge" id="demo-badge" hidden>DEMO</div>
      </div>
    </header>

    <section class="stats">
      <div class="stat">
        <div class="num" id="stat-total">0</div>
        <div class="lbl">messages bridged</div>
      </div>
      <div class="stat"><div class="num c-roblox" id="stat-roblox">0</div><div class="lbl">from Roblox</div></div>
      <div class="stat"><div class="num c-discord" id="stat-discord">0</div><div class="lbl">from Discord</div></div>
      <div class="stat"><div class="num c-minecraft" id="stat-minecraft">0</div><div class="lbl">from Minecraft</div></div>
      <div class="stat"><div class="num" id="stat-uptime">0s</div><div class="lbl">hub uptime</div></div>
    </section>

    <main class="feed" id="feed" aria-live="polite">
      <div class="empty" id="empty">Waiting for chat messages… they will show up here 👀</div>
    </main>

    <form class="composer" id="composer" autocomplete="off">
      <input id="name" placeholder="Your name" maxlength="32" required>
      <input id="msg" placeholder="Send a message to Roblox + Discord + Minecraft at once…" maxlength="500" required>
      <button type="submit">Send&nbsp;➤</button>
    </form>
    <p class="hint">Messages sent from this dashboard appear in all three games. Chat from any platform shows here live.</p>

  </div>
  <script src="app.js"></script>
</body>
</html>
